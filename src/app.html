<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#000000" />
		<meta name="color-scheme" content="dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			// Enables scroll-reveal styles only when JS runs; without JS everything stays visible.
			document.documentElement.classList.add('js');
		</script>
		<script>
			// Vercel Web Analytics via its plain script tag. The @vercel/analytics SvelteKit helper
			// subscribes to $app/stores, which SvelteKit 3 removed, and that crash stopped every page
			// from hydrating. The script tracks client-side navigations on its own.
			if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
				window.va =
					window.va ||
					function () {
						(window.vaq = window.vaq || []).push(arguments);
					};
				const va = document.createElement('script');
				va.src = '/_vercel/insights/script.js';
				va.defer = true;
				document.head.appendChild(va);
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
