<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}" />
  <title>{% block title %}{{ config.title }}{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />

  <script>
    /* Run before paint to prevent flash */
    (function() {
      var stored = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored || (prefersDark ? 'dark' : 'light');
      document.documentElement.classList.add(theme);
    })();
  </script>

  {% block head %}{% endblock %}
</head>
<body class="bg-white dark:bg-[#0a0a0a] text-gray-900 dark:text-gray-100 min-h-screen">

  <div class="max-w-2xl mx-auto px-5">

    <nav class="flex items-center justify-between py-8 mb-4">
      <a href="/" class="font-medium text-gray-900 dark:text-gray-100 hover:text-orange-600 dark:hover:text-orange-400 transition-colors text-sm">
        Chizaram
      </a>
      <div class="flex items-center gap-5">
        <a href="/articles/" class="text-sm text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100 transition-colors">Writing</a>
        <button
          id="theme-toggle"
          aria-label="Toggle dark mode"
          class="text-gray-400 hover:text-gray-700 dark:text-gray-500 dark:hover:text-gray-200 transition-colors flex items-center"
        >
          <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </nav>

    <main class="pb-24">
      {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-gray-100 dark:border-gray-800 py-8 flex items-center justify-between text-sm text-gray-400 dark:text-gray-500">
      <span>Chizaram Ugochukwu</span>
      <div class="flex items-center gap-4">
        <a href="mailto:{{ config.extra.email }}" class="hover:text-gray-700 dark:hover:text-gray-300 transition-colors">Email</a>
        <a href="{{ config.extra.github }}" target="_blank" rel="noopener noreferrer" class="hover:text-gray-700 dark:hover:text-gray-300 transition-colors">GitHub</a>
        <a href="{{ config.extra.linkedin }}" target="_blank" rel="noopener noreferrer" class="hover:text-gray-700 dark:hover:text-gray-300 transition-colors">LinkedIn</a>
      </div>
    </footer>

  </div>

  <script>
    var html = document.documentElement;
    var toggle = document.getElementById('theme-toggle');
    var iconSun = document.getElementById('icon-sun');
    var iconMoon = document.getElementById('icon-moon');

    function applyIcons(theme) {
      if (theme === 'dark') {
        iconSun.classList.remove('hidden');
        iconMoon.classList.add('hidden');
      } else {
        iconSun.classList.add('hidden');
        iconMoon.classList.remove('hidden');
      }
    }

    var current = html.classList.contains('dark') ? 'dark' : 'light';
    applyIcons(current);

    toggle.addEventListener('click', function() {
      var isDark = html.classList.contains('dark');
      var next = isDark ? 'light' : 'dark';
      html.classList.remove('dark', 'light');
      html.classList.add(next);
      localStorage.setItem('theme', next);
      applyIcons(next);
    });
  </script>

</body>
</html>
